[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-auth-service"
version = "0.1.0"
description = "JWT authentication microservice with rotating, hashed refresh tokens and reuse detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["jwt", "authentication", "fastapi", "refresh-token", "security"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 reads bcrypt.__about__, gone in 4.1+
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/matthews-wong/jwt-auth-service"

[tool.setuptools.packages.find]
include = ["jwtauth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
